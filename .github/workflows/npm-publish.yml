name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for tokenless provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npx tsc -p tsconfig.json

      # Step 1: Publish primary package
      - name: Publish Primary Package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Matches anything after the hyphen up to the first dot or alphanumeric block
          TAG=$(node -p "const m = require('./package.json').version.match(/-([a-zA-Z0-9]+)/); m ? m[1] : 'latest'")

          echo "Publishing primary package version: $VERSION under tag: $TAG"
          npm publish --access public --tag "$TAG" --provenance

      # Step 2: Bump major +1 and publish legacy package
      - name: Publish Legacy Package (+1 Major)
        run: |
          NEW_DATA=$(node -e "
            const v = require('./package.json').version;
            // Parse: 1.2.3-beta.0 -> major=1, rest=.2.3-beta.0, tag=beta
            const match = v.match(/^(\d+)(\.[^-\s]+)(?:-([a-zA-Z0-9]+).*|\b.*)$/);
            const major = parseInt(match[1], 10) + 1;
            const newVersion = major + match[2] + (v.includes('-') ? v.slice(v.indexOf('-')) : '');
            const tagMatch = v.match(/-([a-zA-Z0-9]+)/);
            const tag = tagMatch ? tagMatch[1] : 'latest';

            console.log(JSON.stringify({ version: newVersion, tag }));
          ")

          LEGACY_VERSION=$(echo "$NEW_DATA" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf-8')).version")
          LEGACY_TAG=$(echo "$NEW_DATA" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf-8')).tag")

          echo "Publishing legacy package version: $LEGACY_VERSION under tag: $LEGACY_TAG"

          npm pkg set name="optiprune" version="$LEGACY_VERSION"
          npm publish --access public --tag "$LEGACY_TAG" --provenance